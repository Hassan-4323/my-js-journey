<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Cards</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#08162f] min-h-screen text-white">

  <div class="max-w-7xl mx-auto px-6 py-16">
    <div id="cardsContainer" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6"></div>

    <div class="flex justify-center mt-10">
      <button
        id="refreshBtn"
        class="bg-blue-600 hover:bg-blue-700 transition px-8 py-4 rounded-2xl text-2xl font-semibold shadow-lg flex items-center gap-3"
      >
        <span class="text-3xl">↻</span>
        Refresh
      </button>
    </div>
  </div>

  <script src="75Example.js"></script>
</body>
</html>
